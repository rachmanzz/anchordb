version: 2

project_name: anchordb

before:
  hooks:
    - go mod tidy

builds:
  - id: server
    main: ./cmd/server
    binary: anchordb-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

  - id: cli
    main: ./cmd/anchordb
    binary: anchordb
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

  - id: benchmark
    main: ./cmd/benchmark
    binary: anchordb-benchmark
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - docs/*

nfpms:
  - id: packages
    package_name: anchordb
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    vendor: "AnchorDB Team"
    homepage: "https://github.com/rachmanzz/anchordb"
    maintainer: "Muhammad Abdurrahman <rachmanzz.ak@gmail.com>"
    description: "High-performance computational database engine with in-storage math, 2D spatial indexing, and directed causal reasoning."
    license: "Apache 2.0"
    formats:
      - deb
      - rpm
    contents:
      - src: ./packaging/systemd/anchordb.service
        dst: /lib/systemd/system/anchordb.service
        file_info:
          mode: 0644
      - src: ./packaging/systemd/anchordb.default
        dst: /etc/default/anchordb
        type: config|noreplace
        file_info:
          mode: 0644
      - src: ./packaging/systemd/anchordb.default
        dst: /etc/sysconfig/anchordb
        type: config|noreplace
        file_info:
          mode: 0644
    scripts:
      postinstall: ./packaging/scripts/postinst.sh
      preremove: ./packaging/scripts/prerm.sh

checksum:
  name_template: "SHA256SUMS.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
