services:
  anchordb:
    build:
      context: .
      dockerfile: Dockerfile
    image: anchordb:latest
    container_name: anchordb
    restart: unless-stopped
    ports:
      - "7447:7447" # Port Resmi AnchorDB
    environment:
      - ANCHORDB_PORT=7447
      - ANCHORDB_DATA_DIR=/data
      - ANCHORDB_AUTH_TOKEN=""
      - ANCHORDB_IP_WHITELIST="" # Optional: e.g. "127.0.0.1,::1,192.168.1.0/24"
      - ANCHORDB_PARTITION_SCHEDULE="23:00"
    volumes:
      - ./data:/data:Z
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M # Ultra-hemat! Bounded mmap memory
